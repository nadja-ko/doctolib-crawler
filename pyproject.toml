[project]
name = "doctolib-crawler"
version = "0.1.0"
description = "Checks on a regular basis if listed doctors are offering new appointments on doctolib."
readme = "README.md"
authors = [
    { name = "Nadja Ko", email = "n.kolibacz@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "playwright>=1.63.0",
]

[project.scripts]
doctolib-crawler = "doctolib_crawler:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
